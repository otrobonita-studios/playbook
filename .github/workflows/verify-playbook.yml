name: Verify Playbook

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bash-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm run test:bootstrap:bash

  powershell-bootstrap:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - shell: pwsh
        run: npm run test:bootstrap:ps
